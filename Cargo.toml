[package]
name = "linrex"
version = "0.1.0"
edition = "2024"
description = "Terminal UI for Linear issues across workspaces, with a Rex session per issue"
license = "MIT"
repository = "https://github.com/maximilianpw/linrex"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
crossterm = "0.29.0"
dirs = "7.0.0"
dotenvy = "0.15.7"
nucleo-matcher = "0.3.1"
ratatui = "0.30.2"
ratatui-textarea = "0.9.4"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
toml = "1.2.0"

[dev-dependencies]
tempfile = "3.27.0"
